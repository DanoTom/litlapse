<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf9f5" />

  <title>Litlapse — Archivo de ediciones</title>
  <meta name="description" content="Todas las ediciones pasadas de Litlapse: los fragmentos de la literatura universal restaurados, con su autor y su postal descargable." />
  <link rel="canonical" href="https://danotom.github.io/litlapse/archivo.html" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Litlapse" />
  <meta property="og:title" content="Litlapse — Archivo de ediciones" />
  <meta property="og:description" content="Todas las ediciones pasadas: los fragmentos restaurados, con su autor y su postal descargable." />
  <meta property="og:url" content="https://danotom.github.io/litlapse/archivo.html" />
  <meta property="og:image" content="https://danotom.github.io/litlapse/og.png" />
  <meta property="og:locale" content="es_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Litlapse — Archivo de ediciones" />
  <meta name="twitter:image" content="https://danotom.github.io/litlapse/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/litlapse.css" />
</head>
<body>
  <main class="stage">
    <header class="topbar">
      <span class="meta">Hemeroteca</span>
      <span class="logo">L I T L A P S E</span>
      <span class="meta" data-litlapse="archivo-count">— ediciones</span>
    </header>
    <hr class="rule" />

    <section>
      <h1 class="display">Archivo.</h1>
      <p class="archivo-intro"><em>Todas las ediciones, página por página. Cada fragmento restaurado, con su autor y su postal.</em></p>

      <div data-litlapse="archivo-list" class="archivo-list"></div>
    </section>

    <hr class="rule" />
    <div class="colofon">
      <span class="colofon-brand">L I T L A P S E</span>
      <span class="colofon-line">un fragmento al día · <span data-litlapse="anno">MMXXVI</span></span>
      <span class="colofon-links">
        <a href="index.html" class="colofon-link">← la edición de hoy</a>
      </span>
    </div>
  </main>

  <!-- orden estricto de dependencias -->
  <script src="js/puzzles.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/share.js"></script>
  <script src="js/archivo.js"></script>

  <!-- Captura DOM → PNG para las postales descargables. -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js"></script>
</body>
</html>
